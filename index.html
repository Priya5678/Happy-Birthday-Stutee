<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
<title>Happy Birthday Stutee</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

html,body{
    width:100%;
    height:100%;
}

/* ===================================================
   LAVENDER PURPLE BACKGROUND
=================================================== */
body{
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:Georgia, "Times New Roman", serif;

    background:
        radial-gradient(circle at 18% 18%, #e9d5ff 0%, transparent 28%),
        radial-gradient(circle at 82% 82%, #c084fc 0%, transparent 32%),
        linear-gradient(135deg, #24043f, #581c87, #9333ea, #4c1d95, #2e1065);

    color:white;
    user-select:none;
}

/* ===================================================
   OPEN SURPRISE SCREEN (GUARANTEES MUSIC PLAYS 100%)
=================================================== */
.openScreen{
    position:fixed;
    inset:0;
    z-index:10000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at center, rgba(88, 28, 135, 0.96) 0%, rgba(36, 4, 63, 0.98) 100%);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    cursor:pointer;
    transition:opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.7s;
    text-align:center;
    padding:20px;
}

.openScreen.opened{
    opacity:0;
    transform:scale(1.1);
    visibility:hidden;
    pointer-events:none;
}

.openGift{
    font-size:75px;
    animation:giftBounce 1.5s infinite alternate ease-in-out;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5));
}

@keyframes giftBounce{
    0%{ transform:translateY(0) scale(1) rotate(-4deg); }
    100%{ transform:translateY(-18px) scale(1.1) rotate(4deg); }
}

.openTitle{
    margin-top:20px;
    font-size:clamp(22px, 6vw, 34px);
    font-weight:bold;
    letter-spacing:2px;
    color:#ffffff;
    text-shadow:0 0 15px #facc15, 0 3px 10px rgba(0,0,0,0.6);
}

.openSub{
    margin-top:14px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:clamp(14px, 3.8vw, 17px);
    letter-spacing:3px;
    text-transform:uppercase;
    color:#fef08a;
    background:rgba(0,0,0,0.35);
    padding:8px 24px;
    border-radius:30px;
    border:1px solid rgba(253, 224, 71, 0.5);
    box-shadow:0 0 20px rgba(250, 204, 21, 0.4);
    animation:subPulse 2s infinite alternate;
}

@keyframes subPulse{
    0%{ transform:scale(0.96); box-shadow:0 0 12px rgba(250, 204, 21, 0.3); }
    100%{ transform:scale(1.04); box-shadow:0 0 25px rgba(250, 204, 21, 0.7); }
}

/* ===================================================
   CANVAS: JUGNU (FIREFLIES), DUST & SUNFLOWER PETALS
=================================================== */
#fxCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:9999;
}

/* ===================================================
   FLOATING MUSIC CONTROLLER BUTTON
=================================================== */
.musicBtn{
    position:fixed;
    top:12px;
    right:16px;
    z-index:150;
    background:rgba(36, 4, 63, 0.75);
    border:1.5px solid rgba(253, 224, 71, 0.7);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:50%;
    width:40px;
    height:40px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,0.5);
    font-size:17px;
    transition:transform 0.2s ease;
}

.musicBtn:active{
    transform:scale(0.9);
}

.musicPlaying{
    animation:pulseMusic 1.8s infinite;
}

@keyframes pulseMusic{
    0%, 100%{ box-shadow:0 0 10px rgba(250, 204, 21, 0.5); }
    50%{ box-shadow:0 0 22px rgba(250, 204, 21, 0.95); }
}

/* ===================================================
   OUTSIDE CARD: TOP BRANDING (DEVELOPER SNR)
=================================================== */
.topBrandOuter{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
    background:rgba(36, 4, 63, 0.65);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    padding:5px 22px;
    border-radius:30px;
    border:1px solid rgba(253, 224, 71, 0.5);
    box-shadow:0 6px 20px rgba(0,0,0,0.45);
    animation:floatTop 3s ease-in-out infinite alternate;
}

.topBrandOuter .brandText{
    font-family:'Trebuchet MS', sans-serif;
    font-size:12px;
    font-weight:bold;
    letter-spacing:4px;
    color:#fef08a;
    text-transform:uppercase;
    text-shadow:0 0 10px rgba(250, 204, 21, 0.7);
}

@keyframes floatTop{
    0%{ transform:translateX(-50%) translateY(0); }
    100%{ transform:translateX(-50%) translateY(-3px); }
}

/* ===================================================
   OUTSIDE CARD: BOTTOM BRANDING (MADE WITH ❤️ BY SNR)
=================================================== */
.bottomBrandOuter{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    font-family:'Trebuchet MS', sans-serif;
    font-size:12px;
    letter-spacing:2.5px;
    color:rgba(255,255,255,0.92);
    background:rgba(36, 4, 63, 0.65);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    padding:5px 24px;
    border-radius:30px;
    border:1px solid rgba(253, 224, 71, 0.45);
    box-shadow:0 6px 20px rgba(0,0,0,0.45);
    white-space:nowrap;
}

.bottomBrandOuter span{
    color:#ef4444;
    display:inline-block;
    animation:heartBeat 1.4s infinite;
}

@keyframes heartBeat{
    0%, 100%{ transform:scale(1); }
    50%{ transform:scale(1.3); }
}

/* ===================================================
   MAIN CARD (LAVENDER GLASS)
=================================================== */
.card{
    position:relative;
    width:min(94vw, 490px);
    height:min(83vh, 700px);
    border-radius:36px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255, 0.22),
            rgba(255,255,255, 0.06)
        );

    border: 1.5px solid rgba(255, 255, 255, 0.45);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 25px 75px rgba(0,0,0, 0.65),
        inset 0 1px 2px rgba(255,255,255, 0.6);

    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:10;
}

.card::before{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:28px;
    border:1px solid rgba(253, 224, 71, 0.5);
    pointer-events:none;
    z-index:25;
}

/* ===================================================
   LARGE PHOTO AREA WITH MATCHING BLUR BACKDROP
=================================================== */
.photoArea{
    margin-top:16px;
    width:90%;
    height:62%;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:15;
}

.photoFrame{
    position:absolute;
    inset:0;
    padding:6px;
    border-radius:24px;
    background:
        linear-gradient(
            135deg,
            #fff7d6,
            #d8b4fe,
            #fef3c7,
            #a855f7
        );
    box-shadow:
        0 15px 40px rgba(0,0,0,0.55),
        0 0 25px rgba(216, 180, 254, 0.35);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:1;
    transition: transform 0.6s ease, opacity 0.6s ease;
}

.photoFrame.entering{
    animation: zoomFadeIn 0.8s cubic-bezier(.2,.8,.2,1) forwards;
}

.photoFrame.exiting{
    animation: zoomFadeOut 0.7s cubic-bezier(.4,0,.6,1) forwards;
}

@keyframes zoomFadeIn{
    0%{ opacity:0; transform:scale(0.92); }
    100%{ opacity:1; transform:scale(1); }
}

@keyframes zoomFadeOut{
    0%{ opacity:1; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.06); }
}

.imgContainer{
    position:relative;
    width:100%;
    height:100%;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#200338;
}

.frameBlurredBg{
    position:absolute;
    inset:-25px;
    width:calc(100% + 50px);
    height:calc(100% + 50px);
    object-fit:cover;
    filter:blur(22px) brightness(0.7) saturate(1.4);
    transform:scale(1.2);
    z-index:1;
}

.mainImg{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,0.75));
    animation:kenBurns 4.5s ease-in-out forwards;
}

@keyframes kenBurns{
    0%{ transform:scale(1.0); }
    100%{ transform:scale(1.05); }
}

.photoFrame .shine{
    position:absolute;
    top:-50%;
    left:-120%;
    width:65%;
    height:200%;
    background: linear-gradient(
        75deg,
        rgba(255,255,255, 0) 0%,
        rgba(255,255,255, 0.1) 20%,
        rgba(255,255,255, 0.85) 50%,
        rgba(255,255,255, 0.1) 80%,
        rgba(255,255,255, 0) 100%
    );
    transform:rotate(25deg);
    pointer-events:none;
    z-index:5;
    animation:shiningSweep 4.5s ease infinite;
}

@keyframes shiningSweep{
    0%, 20%{ left:-120%; }
    60%, 100%{ left:170%; }
}

/* =========================
   PHOTO COUNTER
========================= */
.counter{
    margin-top:6px;
    z-index:30;
    font-family:monospace, sans-serif;
    font-size:12px;
    letter-spacing:3px;
    color:#fde047;
    background:rgba(36, 4, 63, 0.55);
    padding:2px 14px;
    border-radius:15px;
    border:1px solid rgba(253, 224, 71, 0.35);
}

/* =========================================================================
   SLOW-MOTION TEXT ANIMATION (TRIGGERS AS SOON AS CARD OPENS)
========================================================================= */
.textArea{
    margin-top:auto;
    margin-bottom:14px;
    width:100%;
    text-align:center;
    z-index:30;
    opacity:0;
}

.cardActive .textArea{
    animation:slowMotionDescent 4.8s cubic-bezier(0.25, 1, 0.35, 1) forwards;
}

@keyframes slowMotionDescent{
    0%{
        opacity:1;
        transform:translateY(-240px) scale(1.15);
        filter:drop-shadow(0 0 30px rgba(250, 204, 21, 0.95)) drop-shadow(0 0 50px rgba(255, 255, 255, 0.8));
    }
    30%{
        opacity:1;
        transform:translateY(-240px) scale(1.15);
        filter:drop-shadow(0 0 25px rgba(250, 204, 21, 0.9));
    }
    70%{
        transform:translateY(-80px) scale(1.06);
        filter:drop-shadow(0 0 15px rgba(250, 204, 21, 0.7));
    }
    100%{
        opacity:1;
        transform:translateY(0px) scale(1);
        filter:drop-shadow(0 4px 15px rgba(0,0,0,0.5));
    }
}

.smallText{
    font-family:'Trebuchet MS', sans-serif;
    font-size:clamp(13px, 3.2vw, 16px);
    letter-spacing:9px;
    text-transform:uppercase;
    color:#fff4c2;
    display:inline-block;
    animation:happyFloat 3s ease-in-out infinite alternate;
}

@keyframes happyFloat{
    0%{ transform:translateY(0) scale(1); text-shadow:0 0 8px rgba(255,255,255,0.8), 0 0 18px #fbbf24; }
    100%{ transform:translateY(-3px) scale(1.05); text-shadow:0 0 14px rgba(255,255,255,1), 0 0 28px #f59e0b; }
}

.birthdayText{
    margin-top:1px;
    font-size:clamp(28px, 7.5vw, 44px);
    font-weight:bold;
    letter-spacing:2px;
    color:#ffffff;
    animation:birthdayPulse 2.4s ease-in-out infinite alternate;
}

@keyframes birthdayPulse{
    0%{ transform:scale(1); text-shadow:0 2px 0 #7e22ce, 0 0 15px rgba(234, 179, 8, 0.3), 0 6px 20px rgba(0,0,0,.5); }
    100%{ transform:scale(1.03); text-shadow:0 2px 0 #9333ea, 0 0 25px #ffffff, 0 0 35px #facc15, 0 8px 30px rgba(0,0,0,.7); }
}

.nameText{
    margin-top:0px;
    font-size:clamp(42px, 11vw, 66px);
    font-weight:bold;
    font-style:italic;
    background:linear-gradient(90deg,#ffffff 0%,#fef3c7 20%,#fde68a 40%,#fbbf24 60%,#fef3c7 80%,#ffffff 100%);
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.5));
    animation:nameWave 3.5s linear infinite, nameSway 4s ease-in-out infinite alternate;
}

@keyframes nameWave{ 0%{ background-position:0% center; } 100%{ background-position:300% center; } }
@keyframes nameSway{ 0%{ transform:rotate(-1.5deg) translateY(0); } 100%{ transform:rotate(1.5deg) translateY(-4px); } }

/* ===================================================
   NATURAL FLOWERS & LEAVES
=================================================== */
.flowerElem{
    position:absolute;
    z-index:26;
    pointer-events:none;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,0.45)) drop-shadow(0 0 10px rgba(250, 204, 21, 0.25));
}

.leaf-top-left{ top:25px; left:10px; font-size:28px; transform:rotate(-35deg); animation:swayLeaf 4.5s ease-in-out infinite alternate; }
.lavender-top-left{ top:60px; left:8px; font-size:36px; animation:swayGentle 4s ease-in-out infinite alternate; }
.sunflower-top-right{ top:25px; right:10px; font-size:42px; animation:swayFlower 4.5s ease-in-out infinite; }
.leaf-top-right{ top:70px; right:10px; font-size:26px; transform:rotate(30deg); animation:swayLeaf 5s ease-in-out infinite alternate; }
.sunflower-bottom-left{ bottom:20px; left:12px; font-size:36px; animation:swayFlower 5s ease-in-out infinite 1s; }
.lavender-bottom-right{ bottom:20px; right:12px; font-size:36px; animation:swayGentle 4s ease-in-out infinite 1.2s; }

@keyframes swayFlower{ 0%, 100%{ transform:rotate(-6deg) scale(1); } 50%{ transform:rotate(8deg) scale(1.05); } }
@keyframes swayGentle{ 0%, 100%{ transform:rotate(6deg); } 50%{ transform:rotate(-6deg) translateY(-3px); } }
@keyframes swayLeaf{ 0%{ transform:rotate(-20deg); } 100%{ transform:rotate(15deg) scale(1.08); } }

/* =========================
   RESPONSIVE FIXES
========================= */
@media(max-height:680px){
    .topBrandOuter{ top:6px; padding:3px 14px; font-size:10px; }
    .bottomBrandOuter{ bottom:6px; padding:3px 16px; font-size:10px; }
    .card{ height:82vh; }
    .photoArea{ height:58%; }
    .counter{ display:none; }
    .birthdayText{ font-size:26px; }
    .nameText{ font-size:38px; }
}
</style>
</head>

<body>

<!-- 1-TAP SURPRISE OPENER SCREEN (GUARANTEES 100% MUSIC AUTOPLAY) -->
<div class="openScreen" id="openScreen">
    <div class="openGift">🎁</div>
    <div class="openTitle">A Special Surprise For Stutee</div>
    <div class="openSub">✨ Tap Anywhere to Open ✨</div>
</div>

<!-- AUDIO ELEMENT: aji_tor_din.mp3 -->
<audio id="bgAudio" src="aji_tor_din.mp3" preload="auto" playsinline loop></audio>

<!-- MUSIC TOGGLE BUTTON -->
<div class="musicBtn" id="musicBtn" title="Play/Pause Music">
    <span id="musicIcon">🎵</span>
</div>

<!-- FULLSCREEN CANVAS FOR JUGNU (FIREFLIES), DUST & PETALS -->
<canvas id="fxCanvas"></canvas>

<!-- TOP BRANDING (OUTSIDE CARD) -->
<div class="topBrandOuter">
    <span>🌿</span>
    <span class="brandText">Developer SNR</span>
    <span>🌿</span>
</div>

<!-- MAIN CARD -->
<div class="card" id="mainCard">

    <div class="flowerElem leaf-top-left">🌿</div>
    <div class="flowerElem lavender-top-left">🪻</div>
    <div class="flowerElem sunflower-top-right">🌻</div>
    <div class="flowerElem leaf-top-right">🌿</div>
    <div class="flowerElem sunflower-bottom-left">🌻</div>
    <div class="flowerElem lavender-bottom-right">🪻</div>

    <!-- LARGE PHOTO AREA (WITH MATCHING BLURRED BACKDROP) -->
    <div class="photoArea" id="photoArea"></div>

    <div class="counter" id="counter">01 / 15</div>

    <!-- ANIMATED BIRTHDAY TEXT (SLOW-MOTION DESCENT) -->
    <div class="textArea">
        <div class="smallText">Happy</div>
        <div class="birthdayText">Birthday</div>
        <div class="nameText">Stutee</div>
    </div>

</div>

<!-- BOTTOM BRANDING (OUTSIDE CARD) -->
<div class="bottomBrandOuter">
    Made With <span>❤️</span> By SNR
</div>

<script>
/* ==========================================
   15 PHOTOS
========================================== */
const photos = [
    "https://i.ibb.co/zVkHY8pq/IMG-20260903-WA0013.jpg",
    "https://i.ibb.co/mCr0MDfg/IMG-20260903-WA0014.jpg",
    "https://i.ibb.co/Ymm5WwX/IMG-20260903-WA0010.jpg",
    "https://i.ibb.co/jPD1YFJd/IMG-20260903-WA0011.jpg",
    "https://i.ibb.co/39KwGKLL/IMG-20260903-WA0008.jpg",
    "https://i.ibb.co/b5Ghh7wj/IMG-20260903-WA0012.jpg",
    "https://i.ibb.co/d4GrmXxg/IMG-20260903-WA0003.jpg",
    "https://i.ibb.co/DP6VrPxx/IMG-20260903-WA0005.jpg",
    "https://i.ibb.co/Df0SVy50/IMG-20260903-WA0004.jpg",
    "https://i.ibb.co/zTjQ0SSG/IMG-20260903-WA0007.jpg",
    "https://i.ibb.co/vx61NXH8/IMG-20260903-WA0000.jpg",
    "https://i.ibb.co/HDP45R33/IMG-20260903-WA0001.jpg",
    "https://i.ibb.co/5Wf8yq9F/IMG-20260903-WA0002.jpg",
    "https://i.ibb.co/k691F4cQ/IMG-20260903-WA0009.jpg",
    "https://i.ibb.co/5grkKkj1/IMG-20260903-WA0006.jpg"
];

function bindImageSrc(imgElem, url) {
    let triedProxy = false;
    imgElem.referrerPolicy = "no-referrer";

    imgElem.onerror = function() {
        if (!triedProxy) {
            triedProxy = true;
            this.src = "https://wsrv.nl/?url=" + encodeURIComponent(url);
        }
    };
    imgElem.src = url;
}

photos.forEach(url => {
    const img = new Image();
    bindImageSrc(img, url);
});

const photoArea = document.getElementById("photoArea");
const counter = document.getElementById("counter");
let current = 0;
let activeFrame = null;
const SLIDE_MS = 4500;

function buildFrame(index){
    const frame = document.createElement("div");
    frame.className = "photoFrame";

    const container = document.createElement("div");
    container.className = "imgContainer";

    const blurImg = document.createElement("img");
    blurImg.className = "frameBlurredBg";
    bindImageSrc(blurImg, photos[index]);

    const mainImg = document.createElement("img");
    mainImg.className = "mainImg";
    mainImg.alt = "Birthday Photo";
    bindImageSrc(mainImg, photos[index]);

    const shine = document.createElement("div");
    shine.className = "shine";

    container.appendChild(blurImg);
    container.appendChild(mainImg);
    frame.appendChild(container);
    frame.appendChild(shine);
    return frame;
}

function showPhoto(index){
    const incoming = buildFrame(index);
    incoming.classList.add("entering");
    photoArea.appendChild(incoming);

    if(activeFrame){
        const outgoing = activeFrame;
        outgoing.classList.remove("entering");
        outgoing.classList.add("exiting");
        setTimeout(() => {
            if(outgoing.parentNode) outgoing.remove();
        }, 700);
    }

    activeFrame = incoming;
    counter.textContent = String(index + 1).padStart(2, "0") + " / " + String(photos.length).padStart(2, "0");
}

showPhoto(current);

setInterval(() => {
    current = (current + 1) % photos.length;
    showPhoto(current);
}, SLIDE_MS);

/* ============================================================
   MUSIC & CARD UNLOCK CONTROLLER (aji_tor_din.mp3)

   GOAL: the song should already be sounding the instant the site
   opens, not only after a separate tap on the music button.

   Browsers block audio.play() with sound before ANY user gesture,
   but they always allow a MUTED autoplay. So: start the track
   muted the moment the page loads (it is already playing in the
   background, at position 0, buffered and ready). The very first
   tap anywhere on the page — which is also the "open the card" tap
   — simply unmutes it. There is no decode/buffer delay on that tap,
   so the sound is heard instantly, and it feels like "opening the
   website starts the song" rather than "clicking a button starts it".
========================================================= */
const audio = document.getElementById("bgAudio");
const musicBtn = document.getElementById("musicBtn");
const musicIcon = document.getElementById("musicIcon");
const openScreen = document.getElementById("openScreen");
const mainCard = document.getElementById("mainCard");

let experienceStarted = false;

function updateMusicState(playing) {
    if (playing) {
        musicBtn.classList.add("musicPlaying");
        musicIcon.textContent = "🔊";
    } else {
        musicBtn.classList.remove("musicPlaying");
        musicIcon.textContent = "🎵";
    }
}

// 1) Try to get the track silently running as soon as the page loads,
//    so it's already primed and playing (muted) before any tap happens.
audio.muted = true;
audio.play().catch(() => { /* will retry on first user gesture below */ });

function openCard(x, y){
    if (mainCard.classList.contains("cardActive")) return;
    mainCard.classList.add("cardActive");
    spawnPetalsAt(
        typeof x === "number" ? x : window.innerWidth / 2,
        typeof y === "number" ? y : window.innerHeight / 2
    );
}

function startExperience(e) {
    if (experienceStarted) return;
    experienceStarted = true;

    openScreen.classList.add("opened");

    const x = (e && e.clientX) ? e.clientX : (e && e.touches && e.touches[0] ? e.touches[0].clientX : undefined);
    const y = (e && e.clientY) ? e.clientY : (e && e.touches && e.touches[0] ? e.touches[0].clientY : undefined);
    openCard(x, y);

    // Unmute the already-playing track (instant — no play() delay),
    // and make sure it's actually running in case the muted autoplay
    // attempt above didn't succeed on this browser.
    audio.muted = false;
    const p = audio.play();
    if (p && p.catch) {
        p.then(() => updateMusicState(true)).catch(() => updateMusicState(false));
    } else {
        updateMusicState(true);
    }
}

// The tap on the open screen both reveals the card AND unmutes music
openScreen.addEventListener("click", startExperience);
openScreen.addEventListener("touchstart", startExperience, { passive: true });

// Fallback: if the open screen is somehow bypassed, the very first
// interaction anywhere on the page still starts the experience.
document.addEventListener("click", startExperience, { once: true });
document.addEventListener("touchstart", startExperience, { once: true, passive: true });

// Auto-restart loop safety (in case "loop" attribute is unsupported)
audio.addEventListener("ended", () => {
    audio.currentTime = 0;
    audio.play().catch(() => updateMusicState(false));
});

// Manual toggle button (mute/unmute or pause/resume after the open tap)
musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!experienceStarted) {
        startExperience(e);
        return;
    }
    if (audio.paused) {
        audio.play().then(() => updateMusicState(true));
    } else {
        audio.pause();
        updateMusicState(false);
    }
});

/* =========================================================================
   REALISTIC JUGNU (FIREFLIES), GLOWING DUST & SUNFLOWER PETALS CANVAS
========================================================================= */
const canvas = document.getElementById("fxCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// JUGNU (FIREFLIES)
class Jugnu {
    constructor(){
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 2.2;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.speedY = (Math.random() - 0.5) * 0.8;
        this.glow = Math.random() * Math.PI * 2;
        this.glowSpeed = Math.random() * 0.04 + 0.02;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = Math.random() * 0.03 + 0.01;
    }

    update(){
        this.wobble += this.wobbleSpeed;
        this.speedX += Math.sin(this.wobble) * 0.04;
        this.speedY += Math.cos(this.wobble) * 0.04;

        this.speedX = Math.max(-1.1, Math.min(1.1, this.speedX));
        this.speedY = Math.max(-1.1, Math.min(1.1, this.speedY));

        this.x += this.speedX;
        this.y += this.speedY;

        if(this.x < -30) this.x = canvas.width + 20;
        if(this.x > canvas.width + 30) this.x = -20;
        if(this.y < -30) this.y = canvas.height + 20;
        if(this.y > canvas.height + 30) this.y = -20;

        this.glow += this.glowSpeed;
    }

    draw(){
        const alpha = Math.max(0.12, (Math.sin(this.glow) + 1) / 2);
        ctx.save();
        ctx.shadowColor = "rgba(253, 224, 71, 0.9)";
        ctx.shadowBlur = this.size * 5.5;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(254, 240, 138, ${alpha})`;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 1.2})`;
        ctx.fill();

        ctx.restore();
    }
}

// GLOWING FAIRY DUST
class DustParticle {
    constructor(){
        this.reset(true);
    }

    reset(initial = false){
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
        this.size = Math.random() * 1.8 + 0.8;
        this.vy = -(Math.random() * 0.5 + 0.2);
        this.vx = (Math.random() - 0.5) * 0.35;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.sway = Math.random() * Math.PI * 2;
        this.swaySpeed = Math.random() * 0.02 + 0.01;
    }

    update(){
        this.sway += this.swaySpeed;
        this.x += this.vx + Math.sin(this.sway) * 0.3;
        this.y += this.vy;

        if(this.y < -15 || this.x < -20 || this.x > canvas.width + 20){
            this.reset();
        }
    }

    draw(){
        ctx.save();
        ctx.fillStyle = `rgba(253, 224, 71, ${this.alpha})`;
        ctx.shadowColor = "rgba(250, 204, 21, 0.6)";
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// SUNFLOWER PETALS
class SunflowerPetal {
    constructor(x, y){
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 2.5;
        this.gravity = 0.16 + Math.random() * 0.08;
        this.wind = (Math.random() - 0.5) * 0.5;

        this.width = Math.random() * 8 + 9;
        this.length = Math.random() * 20 + 20;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.08;
        this.flip = Math.random() * Math.PI;
        this.flipSpeed = Math.random() * 0.07 + 0.03;

        const shades = ["#facc15", "#f59e0b", "#fbbf24", "#fef08a", "#eab308"];
        this.color = shades[Math.floor(Math.random() * shades.length)];
        this.opacity = 1;
        this.life = 0;
        this.maxLife = Math.random() * 80 + 110;
    }

    update(){
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.96;
        this.x += Math.sin(this.life * 0.05) * 0.8 + this.wind;

        this.rotation += this.rotSpeed;
        this.flip += this.flipSpeed;
        this.life++;

        if(this.life > this.maxLife - 30){
            this.opacity -= 0.033;
        }
    }

    draw(){
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.scale(Math.sin(this.flip), 1);

        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = this.color;
        ctx.shadowColor = "rgba(234, 179, 8, 0.45)";
        ctx.shadowBlur = 8;

        ctx.beginPath();
        ctx.moveTo(0, -this.length / 2);
        ctx.bezierCurveTo(this.width, -this.length / 4, this.width, this.length / 4, 0, this.length / 2);
        ctx.bezierCurveTo(-this.width, this.length / 4, -this.width, -this.length / 4, 0, -this.length / 2);
        ctx.fill();

        ctx.strokeStyle = "rgba(180, 83, 9, 0.25)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -this.length * 0.35);
        ctx.lineTo(0, this.length * 0.35);
        ctx.stroke();

        ctx.restore();
    }
}

const jugnuArray = Array.from({ length: 28 }, () => new Jugnu());
const dustArray = Array.from({ length: 45 }, () => new DustParticle());
let petals = [];

function spawnPetalsAt(x, y){
    for(let i = 0; i < 16; i++){
        petals.push(new SunflowerPetal(x, y));
    }
}

window.addEventListener("pointerdown", (e) => {
    spawnPetalsAt(e.clientX, e.clientY);
});

function renderFX(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for(let i = 0; i < dustArray.length; i++){
        dustArray[i].update();
        dustArray[i].draw();
    }

    for(let i = 0; i < jugnuArray.length; i++){
        jugnuArray[i].update();
        jugnuArray[i].draw();
    }

    for(let i = petals.length - 1; i >= 0; i--){
        petals[i].update();
        petals[i].draw();
        if(petals[i].opacity <= 0 || petals[i].y > canvas.height + 50){
            petals.splice(i, 1);
        }
    }

    requestAnimationFrame(renderFX);
}
renderFX();
</script>
